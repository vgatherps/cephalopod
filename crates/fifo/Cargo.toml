[package]
name = "ceph-fifo"
description = "Sequencer-side ordering and lifecycle handling for shared-memory streams"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ceph_fifo"

[dependencies]
ceph-proto.workspace = true
ceph-ring.workspace = true

[dev-dependencies]
ceph-fifo = { path = ".", features = ["test-util"] }
ceph-control.workspace = true
ceph-ring = { workspace = true, features = ["test-util"] }
libc.workspace = true

[features]
# Test-only hooks; enabled by this crate's own tests.
test-util = ["ceph-ring/test-util"]
